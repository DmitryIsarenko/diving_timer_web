name: diving_timer_web

services:
  web:
    build: .
    command: gunicorn diving_timer.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build: ./nginx
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - static_data:/var/www/static:ro
    depends_on:
      web:
        condition: service_started
      collectstatic:
        condition: service_completed_successfully
    restart: unless-stopped


  collectstatic:
    user: "0:0"
    build: .
    env_file:
      - .env.local
    volumes:
      - static_data:/app/staticfiles
    command: ["/app/.venv/bin/python", "manage.py", "collectstatic", "--noinput"]
    restart: "no"


  migrate:
    build: .
    command: ["/app/.venv/bin/python", "manage.py", "migrate", "--noinput"]
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5430:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  redis:
    image: redis:latest
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  celery_worker:
    build: .
    command: celery -A diving_timer worker --loglevel=INFO
    env_file:
      - .env.local
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A diving_timer inspect ping --destination=celery@$$HOSTNAME",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  static_data:
