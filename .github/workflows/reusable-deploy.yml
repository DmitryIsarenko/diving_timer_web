name: Reusable Deploy
on:
  workflow_call:

env:
  PROJECT_VERSION: ${{ github.ref_name }}
  APP_IMAGE_TAG: ${{ vars.DOCKERHUB_USERNAME }}/diving-timer-app:${{ github.ref_name }}
  NGINX_IMAGE_TAG: ${{ vars.DOCKERHUB_USERNAME }}/diving-timer-nginx:${{ github.ref_name }}

jobs:
  build_and_push_app_image_to_dockerhub:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: login to dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build app image locally
        run: |
          docker buildx build --load --platform=linux/arm64 \
          -f ./Dockerfile -t "$APP_IMAGE_TAG" .

      - name: push app image to dockerhub
        run: docker push "$APP_IMAGE_TAG"

  build_and_push_nginx_image_to_dockerhub:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v4

      - name: login to dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build nginx image locally
        run: |
          docker buildx build --load --platform=linux/arm64 \
          -f ./nginx/Dockerfile -t "$NGINX_IMAGE_TAG" ./nginx

      - name: push nginx image to dockerhub
        run: docker push "$NGINX_IMAGE_TAG"

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_and_push_nginx_image_to_dockerhub
      - build_and_push_app_image_to_dockerhub
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Create release configuration
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail
          printf '%s\n' \
            "APP_IMAGE=$APP_IMAGE_TAG" \
            "NGINX_IMAGE=$NGINX_IMAGE_TAG" \
            > .release.env

      - name: Copy docker-compose.prod.yml via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "docker-compose.prod.yaml,.release.env"
          target: "/opt/diving_timer_web"

      - name: Pull, rebuild and start
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -o errexit
            set -o nounset
            set -o pipefail

            cd /opt/diving_timer_web

            docker compose \
              --env-file .env.prod \
              --env-file .release.env \
              -f docker-compose.prod.yaml \
              config --quiet

            docker compose \
              --env-file .env.prod \
              --env-file .release.env \
              -f docker-compose.prod.yaml \
              pull

            docker compose \
              --env-file .env.prod \
              --env-file .release.env \
              -f docker-compose.prod.yaml \
              up -d
