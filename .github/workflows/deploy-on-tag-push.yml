name: Deploy release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml

  deploy:
    needs: ci
    uses: ./.github/workflows/reusable-deploy.yml
    secrets: inherit
