name: Dev diving-timer Workflow
on:
  push:
    branches:
      - dev
      - deploy
jobs:
  format-lint-typecheck-pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Install python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9

      - name: Install dependencies
        run: |
          uv venv
          uv sync

      - name: Create .env file
        uses: SpicyPizza/create-envfile@v1.3
        with:
          envkey_DEBUG: false
          envkey_SECRET_KEY: "ci-only-not-for-production"
          directory: ./
          file_name: .env
          fail_on_empty: false

      - name: Linting
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format .

      - name: Type checking
        working-directory: ./diving_timer
        # env:
        #   SECRET_KEY: ci-only-not-for-production
        run: uv run mypy .

      - name: Pytest
        working-directory: ./diving_timer
        run: uv run pytest -v -s
