{% extends 'base.html' %}

{% block content %}
  <section class="container">
    <div class="card">
      <h2>Log in</h2>

      {% if form.non_field_errors %}
        <div role="alert">
          {{ form.non_field_errors }}
        </div>
      {% endif %}

      <form method="post" class="stack">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="nav-btn">
          Log in
        </button>
      </form>

      <p>
        Don't have an account?
        <a href="{% url 'register' %}">
          Sign up
        </a>
      </p>
    </div>
  </section>
{% endblock %}
