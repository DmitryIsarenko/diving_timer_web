<dl class="statistics-list statistics-list--details">
  <div>
    <dt>Inhale</dt>
    <dd>{{ exercise.inhale_duration_seconds }} s</dd>
  </div>

  <div>
    <dt>Hold after inhale</dt>
    <dd>{{ exercise.inhale_hold_duration_seconds }} s</dd>
  </div>

  <div>
    <dt>Exhale</dt>
    <dd>{{ exercise.exhale_duration_seconds }} s</dd>
  </div>

  <div>
    <dt>Hold after exhale</dt>
    <dd>{{ exercise.exhale_hold_duration_seconds }} s</dd>
  </div>

  <div>
    <dt>Number of rounds</dt>
    <dd>{{ exercise.round_count }}</dd>
  </div>
</dl>
