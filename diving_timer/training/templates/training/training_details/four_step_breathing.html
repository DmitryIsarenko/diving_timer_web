<dl class="statistics-list statistics-list--details">
  <div>
    <dt>Вдох</dt>
    <dd>{{ exercise.inhale_duration_seconds }} сек.</dd>
  </div>

  <div>
    <dt>Задержка после вдоха</dt>
    <dd>{{ exercise.inhale_hold_duration_seconds }} сек.</dd>
  </div>

  <div>
    <dt>Выдох</dt>
    <dd>{{ exercise.exhale_duration_seconds }} сек.</dd>
  </div>

  <div>
    <dt>Задержка после выдоха</dt>
    <dd>{{ exercise.exhale_hold_duration_seconds }} сек.</dd>
  </div>

  <div>
    <dt>Количество кругов</dt>
    <dd>{{ exercise.round_count }}</dd>
  </div>
</dl>
