{% extends 'base.html' %} {% block content %}
<section class="container">
  <h2>Four-step breathing</h2>
  <div class="stack">
    <form
      id="exercise-form"
      class="exercise-form"
      data-start-url="{% url 'start_four_step_breathing_exercise' %}"
      data-status-url-template="{% url 'update_training_status' training_id=0 %}"
      data-is-authenticated="{{ user.is_authenticated|yesno:'true,false' }}"
    >
      {% csrf_token %}

      <div class="grid-2">
        <div class="field">
          <label for="inhaleSec">Inhale (seconds)</label>
          <input
            id="inhaleSec"
            name="inhale_duration_seconds"
            type="number"
            min="{{ four_step_minimums.phase_duration_seconds }}"
            step="1"
            value="{{ four_step_defaults.inhale_duration_seconds }}"
            required
          />
        </div>
        <div class="field">
          <label for="holdInSec">Hold after inhale (seconds)</label>
          <input
            id="holdInSec"
            name="inhale_hold_duration_seconds"
            type="number"
            min="{{ four_step_minimums.phase_duration_seconds }}"
            step="1"
            value="{{ four_step_defaults.inhale_hold_duration_seconds }}"
            required
          />
        </div>
        <div class="field">
          <label for="exhaleSec">Exhale (seconds)</label>
          <input
            id="exhaleSec"
            name="exhale_duration_seconds"
            type="number"
            min="{{ four_step_minimums.phase_duration_seconds }}"
            step="1"
            value="{{ four_step_defaults.exhale_duration_seconds }}"
            required
          />
        </div>
        <div class="field">
          <label for="holdOutSec">Hold after exhale (seconds, optional)</label>
          <input
            id="holdOutSec"
            name="exhale_hold_duration_seconds"
            type="number"
            min="{{ four_step_minimums.optional_hold_duration_seconds }}"
            step="1"
            value="{{ four_step_defaults.exhale_hold_duration_seconds }}"
          />
        </div>
        <div class="field">
          <label for="rounds">Rounds</label>
          <input
            id="rounds"
            name="round_count"
            type="number"
            min="{{ four_step_minimums.round_count }}"
            step="1"
            value="{{ four_step_defaults.round_count }}"
            required
          />
        </div>
      </div>

      <div class="controls">
        <button type="button" id="startBtn" class="nav-btn" disabled>
          Start
        </button>
        <button type="button" id="pauseBtn" class="nav-btn" disabled>
          Pause
        </button>
        <button type="button" id="resetBtn" class="nav-btn" disabled>
          Reset
        </button>
        <a
          id="toStats"
          class="nav-btn disabled-link"
          href="{% url 'exercise_statistics' %}"
          aria-disabled="true"
          tabindex="-1"
          >View statistics</a
        >
      </div>

      <div class="grid-3 indicators">
        <div class="card">
          <div class="card-title">Current phase</div>
          <div id="currentPhase" class="card-value">—</div>
        </div>
        <div class="card">
          <div class="card-title">Phase time remaining</div>
          <div id="phaseRemaining" class="card-value">00:00</div>
        </div>
        <div class="card">
          <div class="card-title">Total time remaining</div>
          <div id="totalRemaining" class="card-value">00:00:00</div>
        </div>
      </div>

      <div class="rounds-info">Round: <span id="roundInfo">0 / 0</span></div>

      <div class="total-time-info">
        Total training time: <span id="totalPlanned">00:00:00</span>
      </div>
    </form>
  </div>
</section>
<script src="/static/js/four_step_breathing.js"></script>
{% endblock %}
