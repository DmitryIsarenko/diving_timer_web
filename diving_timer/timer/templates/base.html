<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Diving Timer</title>
    <link rel="stylesheet" href="/static/css/styles.css">

  </head>
  <body>
    <header class="site-header">
      <div class="header-content">
        <h1>Diving Timer</h1>

        <div class="header-navigation">
          <nav class="nav">
            <a class="nav-btn {% if request and request.path == '/' %}active{% endif %}"
              href="{% url 'index' %}">
              Главная
            </a>

            <a class="nav-btn {% if request and request.path == '/exercise/' %}active{% endif %}"
              href="{% url 'exercise' %}">
              Упражнение
            </a>

            <a class="nav-btn {% if request and request.path == '/exercise-statistics/' %}active{% endif %}"
              href="{% url 'exercise_statistics' %}">
              Статистика
            </a>
          </nav>

          <div class="auth-navigation">
            {% if user.is_authenticated %}
              <span class="nav-btn">{{ user.email }}</span>

              <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="nav-btn">Выйти</button>
              </form>
            {% else %}
              <a class="nav-btn" href="{% url 'login' %}">Войти</a>
              <a class="nav-btn" href="{% url 'register' %}">Регистрация</a>
            {% endif %}
          </div>
        </div>
      </div>
      <script>
        (function(){
          var anyActive = document.querySelector('.nav-btn.active');
          if (!anyActive) {
            var path = window.location.pathname;
            document.querySelectorAll('.nav-btn').forEach(function(el){
              if (el.getAttribute('href') === path) el.classList.add('active');
            });
          }
        })();
      </script>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="footer">
      <div class="container">
        <span>© 2026 Diving Timer</span>
        <nav class="footer-nav">
          {% comment %} <a href="/privacy/">Политика</a> {% endcomment %}
          <a href="https://github.com/DmitryIsarenko" target="_blank" rel="noopener">GitHub</a>
        </nav>
      </div>
    </footer>
  </body>
  </html>
